spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/scanning-center;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
  datasource.initialization-mode: always
  datasource.schema: classpath:schema.sql
  datasource.data: classpath:data.sql
